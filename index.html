<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gerador de Parecer Técnico Ambiental</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f3f6f4;--card:#fff;--tx:#17251e;--mu:#5b6b63;--bd:#d3ddd7;--pr:#1f7a4d;--prt:#fff;--in:#fbfdfc}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101814;--card:#18231d;--tx:#e8f0eb;--mu:#98aaa1;--bd:#2c3b33;--pr:#3fb27a;--prt:#06150d;--in:#121b16}}
:root[data-theme="dark"]{--bg:#101814;--card:#18231d;--tx:#e8f0eb;--mu:#98aaa1;--bd:#2c3b33;--pr:#3fb27a;--prt:#06150d;--in:#121b16}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
header{background:var(--pr);color:var(--prt);padding:22px 16px}
header h1{margin:0 auto;max-width:900px;font-size:1.35rem}
header p{margin:4px auto 0;max-width:900px;opacity:.9;font-size:.92rem}
main{max-width:900px;margin:0 auto;padding:16px}
section{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:16px}
h2{margin:0 0 12px;font-size:1.05rem;color:var(--pr)}
.g{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.w{grid-column:1/-1}
label{display:block;font-size:.82rem;color:var(--mu);margin-bottom:3px}
input,textarea{width:100%;font:inherit;color:var(--tx);background:var(--in);border:1px solid var(--bd);border-radius:8px;padding:9px 10px}
textarea{min-height:92px;resize:vertical}
input:focus,textarea:focus{outline:2px solid var(--pr);outline-offset:0}
.ph{display:grid;grid-template-columns:1fr;gap:6px;border:1px dashed var(--bd);border-radius:10px;padding:10px}
.ph b{font-size:.85rem}
.ph img{max-height:110px;max-width:100%;border-radius:6px;display:none;object-fit:contain}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
button{font:inherit;border:0;border-radius:10px;padding:12px 20px;cursor:pointer;background:var(--pr);color:var(--prt);font-weight:600}
button.s{background:transparent;color:var(--tx);border:1px solid var(--bd);font-weight:500}
button:disabled{opacity:.6;cursor:wait}
#msg{font-size:.92rem;color:var(--mu)}
.hint{font-size:.8rem;color:var(--mu);margin:0 0 10px}
@media(max-width:600px){.g{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><h1>Gerador de Parecer Técnico Ambiental</h1><p>Preencha os campos e baixe o parecer em Word, já no modelo oficial.</p></header>
<main>
<div id="form"></div>
<div class="bar"><button id="gen">Gerar parecer (.docx)</button><button class="s" id="clr">Limpar tudo</button><span id="msg"></span></div>
</main>

const NF=12, $=id=>document.getElementById(id), photos={};
const form=$("form");
S.forEach(([t,fs])=>{
  const s=document.createElement("section"); s.innerHTML="<h2>"+t+"</h2><div class='g'></div>";
  const g=s.lastChild;
  fs.forEach(([k,l,ty,w,d])=>{
    const dv=document.createElement("div"); if(w)dv.className="w";
    const lb=document.createElement("label"); lb.htmlFor=k; lb.textContent=l;
    const i=document.createElement(ty==="a"?"textarea":"input"); i.id=k;
    if(ty==="d")i.type="date"; if(ty==="h")i.type="time";
    if(ty==="a")i.rows=3;
    if(d){ if(["t"].includes(ty) && !["numero_processo"].includes(k)) i.value=d; else i.placeholder=d; }
    dv.append(lb,i); g.append(dv);
  });
  form.append(s);
});
const sp=document.createElement("section");
sp.innerHTML="<h2>6. Relatório fotográfico</h2><p class='hint'>Até 12 fotos, com legenda. Campos sem foto são removidos do documento.</p><div class='g' id='pg'></div>";
form.append(sp);
for(let n=1;n<=NF;n++){
  const d=document.createElement("div"); d.className="ph";
  d.innerHTML="<b>Foto "+n+"</b><input type='file' accept='image/*' id='f"+n+"'><img id='p"+n+"' alt=''><input type='text' id='l"+n+"' placeholder='Legenda (ex.: Vista aérea do imóvel.)'>";
  $("pg").append(d);
  d.querySelector("input[type=file]").onchange=async e=>{
    const f=e.target.files[0], im=$("p"+n);
    if(!f){delete photos[n];im.style.display="none";return;}
    try{ photos[n]=await toJpeg(f); im.src=URL.createObjectURL(new Blob([photos[n].buf],{type:"image/jpeg"})); im.style.display="block"; }
    catch(err){ delete photos[n]; e.target.value=""; $("msg").textContent="Não foi possível ler a foto "+n+"."; }
  };
}
async function toJpeg(file){
  const url=URL.createObjectURL(file);
  const img=await new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=no;i.src=url;});
  const m=1400, r=Math.min(1,m/Math.max(img.width,img.height));
  const c=document.createElement("canvas"); c.width=Math.round(img.width*r); c.height=Math.round(img.height*r);
  const x=c.getContext("2d"); x.fillStyle="#fff"; x.fillRect(0,0,c.width,c.height); x.drawImage(img,0,0,c.width,c.height);
  URL.revokeObjectURL(url);
  const blob=await new Promise(ok=>c.toBlob(ok,"image/jpeg",.85));
  return {buf:await blob.arrayBuffer(),w:c.width,h:c.height};
}
// rascunho (apenas texto) no navegador
const ids=()=>[...document.querySelectorAll("#form input:not([type=file]),#form textarea")];
try{ const d=JSON.parse(localStorage.getItem("parecer_rascunho")||"{}"); ids().forEach(i=>{if(d[i.id]!==undefined)i.value=d[i.id];}); }catch(e){}
form.addEventListener("input",()=>{ try{ const d={}; ids().forEach(i=>d[i.id]=i.value); localStorage.setItem("parecer_rascunho",JSON.stringify(d)); }catch(e){} });
$("clr").onclick=()=>{ if(!confirm("Apagar todos os campos preenchidos?"))return;
  try{localStorage.removeItem("parecer_rascunho");}catch(e){} location.reload(); };

const MES=["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
const dP=v=>{const[a,b,c]=v.split("-");return c+"/"+b+"/"+a;};
const dE=v=>{const[a,b,c]=v.split("-");return +c+" de "+MES[+b-1]+" de "+a;};
const hF=v=>{const[h,m]=v.split(":");return h+"h:"+m+"min";};
const esc=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const val=s=>esc(s).replace(/\r?\n/g,'</w:t><w:br/><w:t xml:space="preserve">');

$("gen").onclick=async()=>{
  const btn=$("gen"), msg=$("msg"); btn.disabled=true; msg.textContent="Gerando…";
  try{
    const v={}; ids().forEach(i=>v[i.id]=i.value.trim());
    const up=s=>s.toUpperCase();
    const map={...v,
      data_requerimento:v.data_requerimento?dP(v.data_requerimento):"",
      data_vistoria:v.data_vistoria?dE(v.data_vistoria):"",
      hora_vistoria:v.hora_vistoria?hF(v.hora_vistoria):"",
      data_parecer_extenso:v.data_parecer?dE(v.data_parecer):"",
      municipio_maiusculo:up(v.municipio), zona_localizacao:up(v.zona_localizacao),
      porte:up(v.porte), potencial_poluidor:up(v.potencial_poluidor), objeto_parecer:up(v.objeto_parecer)};
    const zip=await JSZip.loadAsync(Uint8Array.from(atob(B64),c=>c.charCodeAt(0)));
    let x=await zip.file("word/document.xml").async("string");
    let rels=await zip.file("word/_rels/document.xml.rels").async("string");
    let ct=await zip.file("[Content_Types].xml").async("string");
    // fotos
    for(let n=1;n<=NF;n++){
      const ph=new RegExp("<w:t[^>]*>&lt;&lt;foto_"+n+"&gt;&gt;</w:t>"), cp=new RegExp("Imagem: &lt;&lt;legenda_foto_"+n+"&gt;&gt;");
      const p=photos[n], leg=$("l"+n).value.trim();
      if(p){
        let cx=2160000, cy=Math.round(cx*p.h/p.w); if(cy>2800000){cy=2800000;cx=Math.round(cy*p.w/p.h);}
        zip.file("word/media/foto"+n+".jpg",p.buf);
        rels=rels.replace("</Relationships>",'<Relationship Id="rIdFoto'+n+'" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/image" Target="media/foto'+n+'.jpg"/></Relationships>');
        const dr='<w:drawing><wp:inline distT="0" distB="0" distL="0" distR="0"><wp:extent cx="'+cx+'" cy="'+cy+'"/><wp:docPr id="'+(900+n)+'" name="Foto '+n+'"/><a:graphic xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main"><a:graphicData uri="http://schemas.openxmlformats.org/drawingml/2006/picture"><pic:pic xmlns:pic="http://schemas.openxmlformats.org/drawingml/2006/picture"><pic:nvPicPr><pic:cNvPr id="'+(900+n)+'" name="foto'+n+'.jpg"/><pic:cNvPicPr/></pic:nvPicPr><pic:blipFill><a:blip r:embed="rIdFoto'+n+'"/><a:stretch><a:fillRect/></a:stretch></pic:blipFill><pic:spPr><a:xfrm><a:off x="0" y="0"/><a:ext cx="'+cx+'" cy="'+cy+'"/></a:xfrm><a:prstGeom prst="rect"><a:avLst/></a:prstGeom></pic:spPr></pic:pic></a:graphicData></a:graphic></wp:inline></w:drawing>';
        x=x.replace(ph,()=>dr).replace(cp,()=>leg?"Imagem: "+esc(leg):"");
      }else{
        x=x.replace(ph,"<w:t>@@VAZIA@@</w:t>").replace(cp,"");
      }
    }
    if(!/Extension="jpg"/i.test(ct)) ct=ct.replace("<Default ",'<Default Extension="jpg" ContentType="image/jpeg"/><Default ');
    // remove linhas da grade sem nenhuma foto
    x=x.replace(/<w:tr[ >](?:(?!<\/w:tr>)[\s\S])*<\/w:tr>/g,r=>(r.match(/@@VAZIA@@/g)||[]).length>=2?"":r).replace(/@@VAZIA@@/g,"");
    // campos de texto (a atividade aparece em maiúsculas no cabeçalho e como digitada na análise)
    let first=true;
    x=x.replace(/&lt;&lt;atividade_solicitada&gt;&gt;/g,()=>{const r=first?up(v.atividade_solicitada):v.atividade_solicitada;first=false;return val(r);});
    x=x.replace(/&lt;&lt;([a-z_0-9]+)&gt;&gt;/g,(m,k)=>k in map?val(map[k]):"");
    zip.file("word/document.xml",x); zip.file("word/_rels/document.xml.rels",rels); zip.file("[Content_Types].xml",ct);
    const blob=await zip.generateAsync({type:"blob",mimeType:"application/vnd.openxmlformats-officedocument.wordprocessingml.document"});
    const dl=await claude.use("downloads");
    const nome="Parecer_Tecnico_"+(v.numero_processo||"").replace(/[^\w-]+/g,"_")+".docx";
    if(!dl){ msg.textContent="O download não está disponível nesta visualização. Abra a página pelo claude.ai."; }
    else { await dl.save({filename:nome,data:blob}); msg.textContent="Parecer gerado."; }
  }catch(e){
    msg.textContent = e&&e.code==="declined" ? "Download cancelado." : "Erro ao gerar o documento: "+(e&&e.message||e);
  }
  btn.disabled=false;
};
